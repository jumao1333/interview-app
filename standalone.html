<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岗位提效采访 · 麦芽MCN</title>
<style>
/* ============================================================
   Design Tokens — 暗黑极光风 + 网格 + 玻璃卡片
   ============================================================ */
:root {
  --bg-deep: #0a0a0f;
  --bg-card: rgba(20, 20, 40, 0.75);
  --bg-card-hover: rgba(30, 30, 55, 0.85);
  --border-card: rgba(120, 80, 200, 0.25);
  --border-active: rgba(180, 120, 255, 0.55);
  --text-primary: #e8e0f0;
  --text-secondary: #a89abc;
  --text-muted: #6a5a7a;
  --accent: #a860f0;
  --accent-glow: #c080ff;
  --accent-pink: #e060b0;
  --gradient-aurora: linear-gradient(135deg, #1a1040 0%, #0d0d20 30%, #1a0a2a 60%, #0a0a18 100%);
  --grid-color: rgba(120, 80, 200, 0.04);
  --success: #4ade80;
  --error: #f87171;
  --radius: 14px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--gradient-aurora);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* Grid pattern */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--grid-color) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

/* Aurora glow */
body::after {
  content: '';
  position: fixed;
  top: -30%;
  left: 20%;
  width: 60%;
  height: 80%;
  background: radial-gradient(ellipse at center, rgba(120,60,220,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
  animation: aurora-drift 12s ease-in-out infinite alternate;
}

@keyframes aurora-drift {
  0% { transform: translateX(-5%) scale(1); opacity: 0.6; }
  100% { transform: translateX(5%) scale(1.1); opacity: 0.9; }
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 32px 20px 80px;
  position: relative;
  z-index: 1;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 40px;
}

.logo {
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
  opacity: 0.8;
}

.header h1 {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--text-primary), var(--accent-glow));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.subtitle {
  color: var(--text-secondary);
  font-size: 15px;
}

/* Screens */
.screen { display: none; }
.screen.active { display: block; }

/* Role grid */
.role-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 8px;
}

.role-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius);
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s ease;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.role-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-active);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(120, 80, 200, 0.15);
}

.role-card .icon { font-size: 32px; display: block; margin-bottom: 12px; }

.role-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.role-desc {
  font-size: 12px;
  color: var(--text-muted);
}

/* Interview screen */
.back-btn {
  background: none;
  border: 1px solid var(--border-card);
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  padding: 6px 16px;
  cursor: pointer;
  font-size: 13px;
  margin-bottom: 16px;
  transition: all 0.2s;
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Intro box */
.intro-box {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 24px;
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.7;
  backdrop-filter: blur(12px);
}

/* Info fields */
.info-fields {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 24px;
  backdrop-filter: blur(12px);
}

.info-field { margin-bottom: 14px; }
.info-field:last-child { margin-bottom: 0; }
.info-field label {
  display: block;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.info-field input {
  width: 100%;
  background: rgba(10, 10, 25, 0.6);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  padding: 10px 14px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.info-field input:focus { border-color: var(--accent); }

/* Progress */
.progress-wrap {
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.progress-bar {
  flex: 1;
  height: 4px;
  background: rgba(120, 80, 200, 0.15);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-glow));
  border-radius: 2px;
  transition: width 0.3s ease;
}

.progress-text {
  font-size: 12px;
  color: var(--text-muted);
  min-width: 45px;
  text-align: right;
}

/* Question card */
.question-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 24px;
  backdrop-filter: blur(12px);
  animation: fadeUp 0.3s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.question-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.question-prompt {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 18px;
}

/* Options grid */
.options-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.option-chip {
  background: rgba(120, 80, 200, 0.1);
  border: 1px solid var(--border-card);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}

.option-chip:hover {
  border-color: var(--accent);
  background: rgba(120, 80, 200, 0.2);
}

.option-chip.selected {
  background: linear-gradient(135deg, rgba(160, 96, 240, 0.3), rgba(224, 96, 176, 0.3));
  border-color: var(--accent);
  color: var(--accent-glow);
}

/* Note input */
.note-input {
  width: 100%;
  background: rgba(10, 10, 25, 0.4);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  padding: 10px 14px;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.note-input:focus { border-color: var(--accent); }
.note-input::placeholder { color: var(--text-muted); }

/* Textarea */
.text-input {
  width: 100%;
  background: rgba(10, 10, 25, 0.4);
  border: 1px solid var(--border-card);
  border-radius: var(--radius);
  color: var(--text-primary);
  padding: 14px;
  font-size: 14px;
  line-height: 1.6;
  outline: none;
  resize: vertical;
  min-height: 140px;
  font-family: inherit;
  transition: border-color 0.2s;
}
.text-input:focus { border-color: var(--accent); }
.text-input::placeholder { color: var(--text-muted); }

.text-input-short { min-height: 90px; }

/* Buttons */
.nav-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 8px;
}

.btn {
  padding: 12px 32px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-prev {
  background: rgba(120, 80, 200, 0.1);
  border: 1px solid var(--border-card);
  color: var(--text-secondary);
}
.btn-prev:hover:not(:disabled) { border-color: var(--accent); color: var(--text-primary); }

.btn-next, .btn-submit {
  background: linear-gradient(135deg, var(--accent), var(--accent-pink));
  color: white;
  box-shadow: 0 4px 20px rgba(160, 96, 240, 0.3);
}
.btn-next:hover:not(:disabled), .btn-submit:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 28px rgba(160, 96, 240, 0.4);
}

/* Messages */
#submit-msg { margin-top: 16px; text-align: center; }

.msg-error {
  background: rgba(248, 113, 113, 0.15);
  border: 1px solid rgba(248, 113, 113, 0.3);
  border-radius: var(--radius-sm);
  padding: 16px;
  color: var(--error);
  font-size: 14px;
  line-height: 1.6;
}
.msg-error small { color: var(--text-muted); font-size: 12px; }

.msg-success {
  background: rgba(74, 222, 128, 0.1);
  border: 1px solid rgba(74, 222, 128, 0.2);
  border-radius: var(--radius-sm);
  padding: 12px;
  color: var(--success);
  font-size: 14px;
}

/* Complete screen */
.complete-screen {
  text-align: center;
  padding: 60px 20px;
}

.complete-icon { font-size: 64px; display: block; margin-bottom: 20px; }

.complete-screen h2 {
  font-size: 24px;
  margin-bottom: 12px;
  color: var(--text-primary);
}

.complete-screen p {
  color: var(--text-secondary);
  font-size: 15px;
  line-height: 1.7;
  margin-bottom: 32px;
}

.hidden { display: none !important; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-box {
  background: var(--bg-card); border: 1px solid var(--border-active);
  border-radius: var(--radius); padding: 32px; max-width: 520px;
  width: 90%; backdrop-filter: blur(16px); text-align: center;
}
.modal-box h3 { margin-bottom: 16px; color: var(--text-primary); }
.modal-box p { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
.modal-box textarea {
  width: 100%; height: 120px; background: rgba(10,10,25,0.6);
  border: 1px solid var(--border-card); border-radius: var(--radius-sm);
  color: var(--text-primary); font-size: 12px; padding: 12px; resize: vertical;
  font-family: monospace; margin-bottom: 16px;
}
.modal-box .modal-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn-sm {
  padding: 8px 20px; border-radius: var(--radius-sm); font-size: 13px;
  cursor: pointer; border: 1px solid var(--border-card); color: var(--text-secondary);
  background: rgba(120,80,200,0.1); transition: all 0.2s;
}
.btn-sm:hover { border-color: var(--accent); }
.btn-sm.primary { background: linear-gradient(135deg,var(--accent),var(--accent-pink)); color:#fff; border:none; }

/* Admin */
.admin-card {
  background: var(--bg-card); border: 1px solid var(--border-card);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  backdrop-filter: blur(12px);
}
.admin-card .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.admin-card .meta span { color: var(--accent); font-weight: 600; }
.admin-card pre {
  font-size: 11px; color: var(--text-secondary); white-space: pre-wrap;
  word-break: break-all; max-height: 120px; overflow: auto;
  background: rgba(0,0,0,0.3); padding: 10px; border-radius: var(--radius-sm);
  margin: 8px 0;
}

/* Status bar */
.status-bar {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 10;
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--error);
}

.status-dot.online { background: var(--success); }

@media (max-width: 600px) {
  .role-grid { grid-template-columns: 1fr; }
  .container { padding: 20px 16px 80px; }
  .header h1 { font-size: 24px; }
  .question-card { padding: 20px; }
}
</style>
</head>
<body>

<div class="container">

  <!-- ===== Screen 0: Role Selection ===== -->
  <div id="screen-role" class="screen active">
    <div class="header">
      <div class="logo">麦芽 MCN</div>
      <h1>岗位提效采访</h1>
      <p class="subtitle">选你的岗位类型，开始填写。大概花 10-15 分钟。</p>
    </div>
    <div class="role-grid">
      <div class="role-card" onclick="selectRole('content_leader')">
        <span class="icon">🎬</span>
        <div class="role-name">内容负责人/管理层</div>
        <div class="role-desc">组长、内容总监等管理岗位</div>
      </div>
      <div class="role-card" onclick="selectRole('content_editor')">
        <span class="icon">✍️</span>
        <div class="role-name">内容编导</div>
        <div class="role-desc">一线编导、脚本写作、跟拍后期</div>
      </div>
      <div class="role-card" onclick="selectRole('broker_leader')">
        <span class="icon">🤝</span>
        <div class="role-name">经纪负责人/管理层</div>
        <div class="role-desc">经纪团队管理岗</div>
      </div>
      <div class="role-card" onclick="selectRole('broker')">
        <span class="icon">📋</span>
        <div class="role-name">经纪</div>
        <div class="role-desc">一线经纪，推进达人签约</div>
      </div>
    </div>
  </div>

  <!-- ===== Screen 1: Interview ===== -->
  <div id="screen-interview" class="screen">
    <button class="back-btn" onclick="goBack()">← 返回选岗位</button>

    <div class="header">
      <h1 id="interview-title">岗位提效采访</h1>
      <p class="subtitle" id="interview-subtitle"></p>
    </div>

    <div class="intro-box" id="intro-text"></div>

    <div id="info-section" class="info-fields hidden">
      <div class="info-field">
        <label>姓名</label>
        <input type="text" id="input-name" placeholder="你的名字（可写简称）">
      </div>
      <div class="info-field">
        <label>所属岗位</label>
        <input type="text" id="input-position" placeholder="比如：旎旎组编导、重庆经纪">
      </div>
    </div>

    <div class="progress-wrap" id="progress-section" style="display:none">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-text" id="progress-text">0 / 0</div>
    </div>

    <div id="question-area"></div>

    <div class="nav-buttons">
      <button class="btn btn-prev" id="btn-prev" onclick="prevQuestion()">上一题</button>
      <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">下一题</button>
      <button class="btn btn-submit hidden" id="btn-submit" onclick="submitForm()">提交</button>
    </div>

    <div id="submit-msg"></div>
  </div>

  <!-- ===== Screen 2: Completed ===== -->
  <div id="screen-complete" class="screen">
    <div class="complete-screen">
      <span class="complete-icon">🎉</span>
      <h2>提交成功！</h2>
      <p>感谢你的时间。<br>这些信息会帮我们找到真正需要用 AI 和流程优化的地方。</p>
      <button class="btn btn-next" onclick="location.reload()">返回首页</button>
    </div>
  </div>

  <!-- ===== Screen 3: Admin (/?admin) ===== -->
  <div id="screen-admin" class="screen">
    <div class="header" style="margin-top: 0;">
      <h1>📊 管理面板</h1>
      <p class="subtitle">查看待同步的采访数据</p>
    </div>
    <div id="admin-content" style="max-width:800px;margin:0 auto;">
      <div id="admin-stats" style="text-align:center;margin-bottom:24px;color:var(--text-secondary);"></div>
      <div id="admin-queue"></div>
    </div>
    <button class="btn btn-next" style="display:block;margin:20px auto;" onclick="location.href='/'">回首页</button>
  </div>

</div>

<div class="status-bar">
  <span class="status-dot" id="status-dot"></span>
  <span id="status-text">检查连接…</span>
</div>

<!-- Modal for copy-to-clipboard fallback -->
<div id="modal-copy" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>📋 复制数据</h3>
    <p>服务器暂时不可用，请复制下方数据发送给管理员。<br>管理员会用同步脚本上传到飞书。</p>
    <textarea id="modal-json" readonly onclick="this.select()"></textarea>
    <div class="modal-btns">
      <button class="btn-sm primary" onclick="copyModalJSON()">复制到剪贴板</button>
      <button class="btn-sm" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ALL QUESTIONS EMBEDDED — no server needed for loading
   ============================================================ */
const ALL_QUESTIONS = {
  content_leader: {
    intro: "这份问卷主要看内容团队在脚本以外，还有哪些工作可以被AI、模板、检查表或SOP提效。脚本生成工具已有，重点问复盘、判断标准、返工、团队协作和标准沉淀。",
    questions: [
      {id:"q1",title:"1. 你这条线现在最重要的结果是什么？",type:"select",options:["提高爆款率","减少返工","提升账号增长","提升新人培养","复盘更准","标准更统一"],note_prompt:"为什么是这个？"},
      {id:"q2",title:"2. 脚本生成之外，你最想让AI帮内容团队解决什么？",type:"select",options:["评论/差评归类","内容方向复盘","账号阶段判断","拍摄表达复盘","后期返工前置","团队SOP","检查清单","判断标准沉淀"],note_prompt:"现在这件事最麻烦在哪里？"},
      {id:"q3",title:"3. 团队最容易反复出现的问题是什么？",type:"select",options:["选题判断不准","脚本可拍性不足","人设不够贴","拍摄表达弱","后期返工多","复盘太空","新人理解慢","账号阶段判断不一致"],note_prompt:"最近一次是什么情况？"},
      {id:"q4",title:"4. 讲一个最近「脚本不差，但最后效果不好」的案例。",type:"text",note_prompt:"写清楚是什么内容、哪里出了问题、你现在判断原因是什么。"},
      {id:"q5",title:"5. 你判断一个账号或内容方向变好的关键标准是什么？",type:"text",note_prompt:"尽量写成新人也能照着判断的标准。"},
      {id:"q6",title:"6. 你们现在已有哪类提效方法？",type:"select",options:["提示词","表格模板","脚本工具","复盘模板","检查清单","自动整理","还没有固定用法"],note_prompt:"谁在用？解决了什么？哪里还不稳定？"},
      {id:"q7",title:"7. 如果下周只验证一个小提效动作，你想先验证什么？",type:"select",options:["脚本可拍检查","拍摄前检查","后期返工归因","评论反馈归类","账号阶段判断","新人训练清单","内容复盘模板"],note_prompt:"为什么先验证这个？"},
      {id:"q8",title:"8. 你最希望编导补充哪类真实信息？",type:"select",options:["每周最花时间的动作","返工案例","AI脚本不好用原因","拍摄现场问题","后期沟通问题","他们自己的判断标准"],note_prompt:"你拿到这些信息后，最想判断什么？"}
    ]
  },
  content_editor: {
    intro: "这份问卷不是检查你，而是想知道你每周真实花时间最多、最容易返工、最希望被工具帮到的地方。脚本、拍摄、跟后期都可以写，越具体越有用。",
    questions: [

/* ============================================================
   State
   ============================================================ */
let currentRole = null;
let questions = [];
let currentStep = -1;
let answers = {};
let serverOnline = false;

/* ============================================================
   Screen Navigation
   ============================================================ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function selectRole(role) {
  currentRole = role;
  showScreen('interview');
  loadQuestions(role);
}

function goBack() {
  currentRole = null;
  questions = [];
  currentStep = -1;
  answers = {};
  showScreen('role');
}

/* ============================================================
   Load Questions (EMBEDDED, no API call!)
   ============================================================ */
const ROLE_NAMES = {
  content_leader: '内容负责人/管理层',
  content_editor: '内容编导',
  broker_leader: '经纪负责人/管理层',
  broker: '经纪'
};

function loadQuestions(role) {
  var data = ALL_QUESTIONS[role];
  if (!data) {
    document.getElementById('question-area').innerHTML = '<div class="msg-error">未知岗位类型</div>';
    return;
  }
  document.getElementById('interview-title').textContent = ROLE_NAMES[role] + ' · 岗位提效采访';
  document.getElementById('interview-subtitle').textContent = '按真实情况写，不用正式，越具体越有用';
  questions = data.questions;
  document.getElementById('intro-text').textContent = data.intro || '';
  answers = {};
  currentStep = -1;
  showInfoScreen();
}

function showInfoScreen() {
  document.getElementById('info-section').classList.remove('hidden');
  document.getElementById('progress-section').style.display = 'none';
  document.getElementById('question-area').innerHTML = '';
  document.getElementById('btn-prev').classList.add('hidden');
  document.getElementById('btn-next').classList.remove('hidden');
  document.getElementById('btn-submit').classList.add('hidden');
  document.getElementById('btn-next').textContent = '开始答题';
  document.getElementById('submit-msg').innerHTML = '';
}

function renderQuestion(idx) {
  if (idx < 0 || idx >= questions.length) return;
  document.getElementById('info-section').classList.add('hidden');
  document.getElementById('progress-section').style.display = 'flex';

  var q = questions[idx];
  var existing = answers[q.id];
  var note = '';
  var selected = [];
  var textVal = '';

  if (existing) {
    if (typeof existing === 'object') {
      note = existing.note || '';
      selected = existing.selected || [];
    } else {
      textVal = existing;
    }
  }

  var total = questions.length;
  var pct = (idx / total) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = (idx + 1) + ' / ' + total;

  var html = '<div class="question-card"><div class="question-title">' + q.title + '</div>';
  if (q.note_prompt) {
    html += '<div class="question-prompt">' + escHtml(q.note_prompt) + '</div>';
  }

  if (q.type === 'select') {
    html += '<div class="options-grid">';
    q.options.forEach(function(opt) {
      var sel = selected.indexOf(opt) >= 0 ? ' selected' : '';
      html += '<span class="option-chip' + sel + '" onclick="toggleOption(this,\'' + q.id + '\',\'' + escAttr(opt) + '\')">' + opt + '</span>';
    });
    html += '</div>';
    html += '<input type="text" class="note-input" placeholder="补充说明（选填）…" id="note-' + q.id + '" value="' + escAttr(note) + '" onchange="updateNote(\'' + q.id + '\', this.value)">';
  } else {
    var cls = q.id === 'q14' ? 'text-input' : 'text-input text-input-short';
    html += '<textarea class="' + cls + '" placeholder="' + escAttr(q.note_prompt || '') + '" id="text-' + q.id + '" onchange="updateText(\'' + q.id + '\', this.value)">' + escHtml(textVal) + '</textarea>';
  }
  html += '</div>';
  document.getElementById('question-area').innerHTML = html;

  document.getElementById('btn-prev').classList.toggle('hidden', idx === 0);
  document.getElementById('btn-next').classList.toggle('hidden', idx === total - 1);
  document.getElementById('btn-submit').classList.toggle('hidden', idx !== total - 1);
  document.getElementById('btn-next').textContent = '下一题';
}

function nextQuestion() {
  saveCurrentAnswer();
  if (currentStep === -1) { currentStep = 0; renderQuestion(0); return; }
  currentStep++;
  if (currentStep >= questions.length) currentStep = questions.length - 1;
  renderQuestion(currentStep);
}

function prevQuestion() {
  saveCurrentAnswer();
  currentStep--;
  if (currentStep < 0) { showInfoScreen(); return; }
  renderQuestion(currentStep);
}

/* ============================================================
   Answers
   ============================================================ */
function toggleOption(el, qid, opt) {
  el.classList.toggle('selected');
  var sels = [];
  el.parentElement.querySelectorAll('.option-chip.selected').forEach(function(c) { sels.push(c.textContent.trim()); });
  if (!answers[qid] || typeof answers[qid] === 'string') answers[qid] = {selected:[], note:''};
  answers[qid].selected = sels;
}

function updateNote(qid, val) {
  if (!answers[qid] || typeof answers[qid] === 'string') answers[qid] = {selected:[], note:''};
  answers[qid].note = val;
}

function updateText(qid, val) { answers[qid] = val; }

function saveCurrentAnswer() {
  if (currentStep >= 0 && currentStep < questions.length) {
    var q = questions[currentStep];
    if (q.type === 'text') {
      var el = document.getElementById('text-' + q.id);
      if (el) answers[q.id] = el.value;
    } else {
      var nel = document.getElementById('note-' + q.id);
      if (nel && answers[q.id] && typeof answers[q.id] === 'object') answers[q.id].note = nel.value;
    }
  }
}

/* ============================================================
   Submit — dual-mode: local server + localStorage fallback
   ============================================================ */
async function submitForm() {
  saveCurrentAnswer();
  var btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = '提交中…';
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-text').textContent = questions.length + ' / ' + questions.length;

  var name = document.getElementById('input-name').value.trim();
  var position = document.getElementById('input-position').value.trim();

  if (!name || !position) {
    document.getElementById('submit-msg').innerHTML = '<div class="msg-error">请先填写姓名和所属岗位（返回上一步）</div>';
    btn.disabled = false; btn.textContent = '提交'; currentStep = -1; showInfoScreen(); return;
  }

  var payload = { role: currentRole, name: name, position: position, answers: answers };

  // Try local server first
  var submitted = false;
  try {
    var resp = await fetch('/api/submit', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    var result = await resp.json();
    if (result.ok) { submitted = true; }
  } catch(e) {}

  if (submitted) {
    showScreen('complete');
  } else {
    // Fallback: save to localStorage + show copy modal
    fallbackSave(payload);
    showCopyModal(payload);
  }
}

// Override btn restore is handled by showCopyModal

function showCopyModal(payload) {
  var jsonStr = JSON.stringify(payload, null, 2);
  document.getElementById('modal-json').value = jsonStr;
  document.getElementById('modal-copy').classList.remove('hidden');
}

function copyModalJSON() {
  var ta = document.getElementById('modal-json');
  ta.select();
  try {
    navigator.clipboard.writeText(ta.value);
  } catch(e) {
    document.execCommand('copy');
  }
  var btn = document.querySelector('#modal-copy .btn-sm.primary');
  btn.textContent = '已复制 ✅';
  setTimeout(function(){ btn.textContent = '复制到剪贴板'; }, 2000);
}

function closeModal() {
  document.getElementById('modal-copy').classList.add('hidden');
  document.getElementById('btn-submit').disabled = false;
  document.getElementById('btn-submit').textContent = '重新提交';
}

function fallbackSave(payload) {
  try {
    var queue = JSON.parse(localStorage.getItem('interview_queue') || '[]');
    payload._savedAt = new Date().toISOString();
    queue.push(payload);
    localStorage.setItem('interview_queue', JSON.stringify(queue));
    document.getElementById('submit-msg').innerHTML =
      '<div class="msg-success">✅ 已保存到本地（第' + queue.length + '份待同步）<br><small>管理员稍后将统一上传到飞书</small></div>';
  } catch(e) {
    document.getElementById('submit-msg').innerHTML =
      '<div class="msg-error">提交失败，请刷新页面重试<br><small>错误: ' + escHtml(e.message) + '</small></div>';
  }
}

/* ============================================================
   Helpers
   ============================================================ */
function escHtml(s) { if(!s)return''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { if(!s)return''; return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ============================================================
   Connection check
   ============================================================ */
(function checkServer() {
  var dot = document.getElementById('status-dot');
  var txt = document.getElementById('status-text');
  fetch('/api/health').then(function(r){ return r.json(); }).then(function(d){
    if(d && d.feishu_connected){ dot.className = 'status-dot online'; txt.textContent = '飞书已连接'; }
    else { txt.textContent = '飞书未连接'; }
  }).catch(function(){ txt.textContent = '离线模式'; });
})();

/* ============================================================
   Admin Panel (?admin)
   ============================================================ */
(function initAdmin() {
  if (location.search.indexOf('admin') < 0) return;
  showScreen('admin');
  renderAdmin();
  // Auto-refresh every 5s
  setInterval(renderAdmin, 5000);
})();

function renderAdmin() {
  var queue = [];
  try { queue = JSON.parse(localStorage.getItem('interview_queue') || '[]'); }
  catch(e) { queue = []; }

  var stats = document.getElementById('admin-stats');
  stats.innerHTML = '<b>' + queue.length + '</b> 份待同步数据 &nbsp;|&nbsp; '
    + '<button class="btn-sm primary" onclick="exportAll()">导出全部</button> &nbsp;'
    + '<button class="btn-sm" onclick="clearQueue()">清空队列</button> &nbsp;'
    + '<button class="btn-sm" onclick="renderAdmin()">刷新</button>';

  var container = document.getElementById('admin-queue');
  if (queue.length === 0) {
    container.innerHTML = '<div class="intro-box">暂无待同步数据。团队成员提交后，数据会出现在这里。</div>';
    return;
  }

  var ROLE_NAMES = {
    content_leader:'内容负责人/管理层', content_editor:'内容编导',
    broker_leader:'经纪负责人/管理层', broker:'经纪'
  };

  var html = '';
  queue.forEach(function(entry, i) {
    var savedAt = entry._savedAt || '?';
    html += '<div class="admin-card">';
    html += '<div class="meta">#' + (i+1) + ' <span>' + (ROLE_NAMES[entry.role]||entry.role) + '</span> · '
      + (entry.name||'?') + ' · ' + (entry.position||'?') + ' · ' + savedAt + '</div>';
    html += '<pre>' + escHtml(JSON.stringify(entry, null, 2).substring(0, 300)) + '...</pre>';
    html += '<button class="btn-sm" onclick="copyEntry(' + i + ')">复制</button> ';
    html += '<button class="btn-sm" onclick="deleteEntry(' + i + ')">删除</button>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function exportAll() {
  var queue = [];
  try { queue = JSON.parse(localStorage.getItem('interview_queue') || '[]'); }
  catch(e) { queue = []; }
  if (queue.length === 0) { alert('无数据可导出'); return; }
  var blob = new Blob([JSON.stringify(queue, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'interview-queue-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function copyEntry(i) {
  var queue = JSON.parse(localStorage.getItem('interview_queue') || '[]');
  var json = JSON.stringify(queue[i], null, 2);
  document.getElementById('modal-json').value = json;
  document.getElementById('modal-copy').classList.remove('hidden');
}

function deleteEntry(i) {
  var queue = JSON.parse(localStorage.getItem('interview_queue') || '[]');
  queue.splice(i, 1);
  localStorage.setItem('interview_queue', JSON.stringify(queue));
  renderAdmin();
}

function clearQueue() {
  if (!confirm('确定清空所有待同步数据？')) return;
  localStorage.removeItem('interview_queue');
  renderAdmin();
}
