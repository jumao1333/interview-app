<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>岗位提效采访 · 麦芽MCN</title>
<style>
/* ============================================================
   Apple Keynote Aesthetic — Deep Black + Frosted Glass + Generous Space
   ============================================================ */
:root {
  --bg: #000;
  --card-bg: rgba(255,255,255,0.05);
  --card-hover: rgba(255,255,255,0.08);
  --card-border: rgba(255,255,255,0.08);
  --card-active-border: rgba(255,255,255,0.18);
  --text: #f5f5f7;
  --text-sub: #86868b;
  --text-dim: #6e6e73;
  --accent: #2997ff;
  --accent-dim: rgba(41,151,255,0.15);
  --success: #30d158;
  --error: #ff453a;
  --radius: 20px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* Ambient glow — very subtle */
body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: 50%;
  transform: translateX(-50%);
  width: 800px;
  height: 800px;
  background: radial-gradient(circle at center, rgba(41,151,255,0.04), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 24px 120px;
  position: relative;
  z-index: 1;
}

/* ============================================================
   Hero — Apple product page style
   ============================================================ */
.hero {
  text-align: center;
  padding: 80px 0 48px;
}

.hero-tag {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 2px;
  color: var(--accent);
  margin-bottom: 16px;
  text-transform: uppercase;
}

.hero h1 {
  font-family: var(--font-display);
  font-size: 48px;
  font-weight: 600;
  letter-spacing: -0.5px;
  line-height: 1.1;
  color: var(--text);
  margin-bottom: 12px;
}

.hero p {
  font-size: 17px;
  color: var(--text-sub);
  line-height: 1.5;
  max-width: 400px;
  margin: 0 auto;
}

@media (max-width: 600px) {
  .hero { padding: 48px 0 36px; }
  .hero h1 { font-size: 34px; }
  .hero p { font-size: 15px; }
}

/* ============================================================
   Role Cards — Frosted glass
   ============================================================ */
.role-section { margin-top: 8px; }

.role-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.role-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: relative;
  overflow: hidden;
}

.role-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(255,255,255,0.03), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.role-card:hover {
  background: var(--card-hover);
  border-color: var(--card-active-border);
  transform: scale(1.02);
}
.role-card:hover::after { opacity: 1; }

.role-icon {
  font-size: 36px;
  display: block;
  margin-bottom: 14px;
  filter: grayscale(0.2);
}

.role-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.role-desc {
  font-size: 12px;
  color: var(--text-dim);
}

@media (max-width: 500px) {
  .role-grid { grid-template-columns: 1fr; }
  .hero h1 { font-size: 30px; }
}

/* ============================================================
   Interview Screen
   ============================================================ */
.interview-hero {
  text-align: center;
  padding: 48px 0 32px;
}

.interview-hero h2 {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 600;
  letter-spacing: -0.3px;
  margin-bottom: 8px;
}

.interview-hero p {
  color: var(--text-sub);
  font-size: 15px;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-sub);
  font-size: 14px;
  cursor: pointer;
  padding: 8px 0;
  margin-bottom: 16px;
  transition: color 0.2s;
  background: none;
  border: none;
  font-family: inherit;
}
.back-link:hover { color: var(--text); }

/* Intro */
.intro-box {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 28px;
  color: var(--text-sub);
  font-size: 14px;
  line-height: 1.7;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

/* Info inputs */
.info-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 28px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.field { margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }

.field label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-sub);
  margin-bottom: 8px;
}

.field input {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius-xs);
  color: var(--text);
  padding: 12px 16px;
  font-size: 15px;
  font-family: var(--font-body);
  outline: none;
  transition: all 0.2s;
  -webkit-appearance: none;
}
.field input:focus {
  border-color: var(--accent);
  background: rgba(255,255,255,0.06);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

/* ============================================================
   Progress — Clean dot indicator
   ============================================================ */
.progress-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-bottom: 32px;
}

.progress-dot {
  width: 6px;
  height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.12);
  transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
}
.progress-dot.done { background: rgba(255,255,255,0.25); }
.progress-dot.active { background: var(--accent); width: 24px; }

/* ============================================================
   Question Card — Apple card style
   ============================================================ */
.question-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 32px;
  margin-bottom: 24px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  animation: cardIn 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
}

@keyframes cardIn {
  from { opacity:0; transform:translateY(16px); }
  to { opacity:1; transform:translateY(0); }
}

.question-num {
  font-size: 12px;
  font-weight: 500;
  color: var(--accent);
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.question-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.35;
  margin-bottom: 8px;
}

.question-prompt {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.5;
  margin-bottom: 24px;
}

/* Options — Apple chip style */
.options-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}

.option-chip {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 10px 18px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
  user-select: none;
  color: var(--text-sub);
}
.option-chip:hover {
  border-color: rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.06);
  color: var(--text);
}
.option-chip.selected {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

/* Note input — typing supplement area */
.note-wrap {
  position: relative;
  margin-top: 12px;
}

.note-input {
  width: 100%;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 14px 16px;
  font-size: 15px;
  font-family: var(--font-body);
  line-height: 1.6;
  outline: none;
  resize: vertical;
  min-height: 80px;
  transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
  -webkit-appearance: none;
}
.note-input:focus {
  border-color: rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.06);
  box-shadow: 0 0 0 3px rgba(255,255,255,0.03);
  min-height: 120px;
}
.note-input::placeholder { color: var(--text-dim); }

.note-label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 500;
}

.note-label .icon-pencil {
  width: 14px;
  height: 14px;
  opacity: 0.5;
}

.note-hint {
  font-size: 11px;
  color: var(--text-dim);
  text-align: right;
  margin-top: 6px;
  opacity: 0;
  transition: opacity 0.3s;
}
.note-input:focus ~ .note-hint { opacity: 0.6; }

.note-char-count {
  display: inline-block;
  margin-left: 4px;
}

/* Textarea */
.text-input {
  width: 100%;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 16px;
  font-size: 15px;
  line-height: 1.6;
  font-family: var(--font-body);
  outline: none;
  resize: vertical;
  min-height: 160px;
  transition: all 0.2s;
  -webkit-appearance: none;
}
.text-input:focus {
  border-color: rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
}
.text-input::placeholder { color: var(--text-dim); }
.text-input-short { min-height: 100px; }

/* ============================================================
   Navigation Buttons
   ============================================================ */
.nav-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
  margin-top: 4px;
}

.btn {
  padding: 14px 36px;
  border-radius: 100px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
  border: none;
  font-family: var(--font-body);
  letter-spacing: -0.2px;
}
.btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; }

.btn-prev {
  background: rgba(255,255,255,0.06);
  color: var(--text-sub);
}
.btn-prev:hover:not(:disabled) {
  background: rgba(255,255,255,0.1);
  color: var(--text);
}

.btn-next, .btn-submit {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0 20px rgba(41,151,255,0.2);
}
.btn-next:hover:not(:disabled), .btn-submit:hover:not(:disabled) {
  background: #40a9ff;
  box-shadow: 0 0 30px rgba(41,151,255,0.3);
  transform: scale(1.02);
}

/* ============================================================
   Complete Screen
   ============================================================ */
.complete-screen {
  text-align: center;
  padding: 100px 20px 60px;
}
.complete-icon { font-size: 64px; display: block; margin-bottom: 24px; }
.complete-screen h2 {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 600;
  margin-bottom: 12px;
}
.complete-screen p {
  color: var(--text-sub);
  font-size: 16px;
  line-height: 1.7;
  margin-bottom: 40px;
  max-width: 360px;
  margin-left: auto;
  margin-right: auto;
}

/* ============================================================
   Messages
   ============================================================ */
#submit-msg { margin-top: 20px; text-align: center; }

.msg-error {
  background: rgba(255,69,58,0.08);
  border: 1px solid rgba(255,69,58,0.2);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  color: var(--error);
  font-size: 14px;
  line-height: 1.5;
}
.msg-error small { color: var(--text-dim); display: block; margin-top: 4px; }

.msg-success {
  background: rgba(48,209,88,0.08);
  border: 1px solid rgba(48,209,88,0.2);
  border-radius: var(--radius-sm);
  padding: 14px 20px;
  color: var(--success);
  font-size: 14px;
  text-align: center;
}
.msg-success small { color: var(--text-dim); display: block; margin-top: 4px; }

/* ============================================================
   Status bar
   ============================================================ */
.status-bar {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 10;
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
}
.status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--error);
  transition: background 0.3s;
}
.status-dot.online { background: var(--success); }

/* ============================================================
   Modal
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.modal-box {
  background: #1c1c1e;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  padding: 36px;
  max-width: 520px;
  width: 90%;
  text-align: center;
}
.modal-box h3 { font-family: var(--font-display); font-size: 20px; margin-bottom: 12px; color: var(--text); }
.modal-box p { color: var(--text-sub); font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
.modal-box textarea {
  width: 100%; height: 140px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius-xs);
  color: var(--text); font-size: 12px; padding: 14px;
  font-family: 'SF Mono', 'Menlo', monospace;
  margin-bottom: 16px;
  resize: vertical;
}
.modal-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* Admin panel */
.admin-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 12px;
  backdrop-filter: blur(20px);
}
.admin-card .meta { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
.admin-card .meta span { color: var(--accent); font-weight: 600; }
.admin-card pre {
  font-size: 11px; color: var(--text-sub); white-space: pre-wrap;
  word-break: break-all; max-height: 100px; overflow: auto;
  background: rgba(0,0,0,0.4); padding: 10px; border-radius: var(--radius-xs); margin: 8px 0;
}

/* ============================================================
   Utilities
   ============================================================ */
.screen { display: none; }
.screen.active { display: block; }
.hidden { display: none !important; }

@media (max-width: 600px) {
  .container { padding: 0 16px 100px; }
  .question-card { padding: 24px 20px; }
  .question-title { font-size: 19px; }
  .interview-hero h2 { font-size: 28px; }
  .btn { padding: 14px 28px; font-size: 14px; }
}
</style>
</head>
<body>

<div class="container">

  <!-- ===== Screen 0: Role Selection ===== -->
  <div id="screen-role" class="screen active">
    <div class="hero">
      <div class="hero-tag">MAIYA MCN</div>
      <h1>岗位提效采访</h1>
      <p>选你的岗位，开始填写。预计 8-12 分钟。</p>
    </div>
    <div class="role-section">
      <div class="role-grid">
        <div class="role-card" onclick="selectRole('content_leader')">
          <span class="role-icon">🎬</span>
          <div class="role-name">内容负责人/管理层</div>
          <div class="role-desc">组长、内容总监等管理岗</div>
        </div>
        <div class="role-card" onclick="selectRole('content_editor')">
          <span class="role-icon">✍️</span>
          <div class="role-name">内容编导</div>
          <div class="role-desc">一线编导、脚本写作、跟拍后期</div>
        </div>
        <div class="role-card" onclick="selectRole('broker_leader')">
          <span class="role-icon">🤝</span>
          <div class="role-name">经纪负责人/管理层</div>
          <div class="role-desc">经纪团队管理岗</div>
        </div>
        <div class="role-card" onclick="selectRole('broker')">
          <span class="role-icon">📋</span>
          <div class="role-name">经纪</div>
          <div class="role-desc">一线经纪，推进达人签约</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Screen 1: Interview ===== -->
  <div id="screen-interview" class="screen">
    <button class="back-link" id="back-link" onclick="goBack()">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M7 2L3 6l4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      返回选岗位
    </button>

    <div class="interview-hero">
      <h2 id="interview-title">岗位提效采访</h2>
      <p id="interview-subtitle">按真实情况写，不用正式，越具体越有用</p>
    </div>

    <div class="intro-box" id="intro-text"></div>

    <div id="info-section" class="info-card hidden">
      <div class="field">
        <label>你的名字</label>
        <input type="text" id="input-name" placeholder="可写简称，方便我知道是谁">
      </div>
    </div>

    <div id="progress-section" class="progress-wrap hidden"></div>

    <div id="question-area"></div>

    <div class="nav-row">
      <button class="btn btn-prev" id="btn-prev" onclick="prevQuestion()">上一题</button>
      <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">下一题</button>
      <button class="btn btn-submit hidden" id="btn-submit" onclick="submitForm()">提交</button>
    </div>

    <div id="submit-msg"></div>
  </div>

  <!-- ===== Screen 2: Completed ===== -->
  <div id="screen-complete" class="screen">
    <div class="complete-screen">
      <span class="complete-icon" id="complete-icon">🎉</span>
      <h2 id="complete-title">提交成功</h2>
      <p id="complete-desc">感谢你的时间。这些信息会帮我们找到真正需要提效的地方。</p>
      <button class="btn btn-next" onclick="location.reload()">完成</button>
    </div>
  </div>

</div>

<div class="status-bar">
  <span class="status-dot" id="status-dot"></span>
  <span id="status-text">检查连接…</span>
</div>

<!-- Modal for offline fallback -->
<div id="modal-copy" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>复制数据</h3>
    <p>服务器暂时不可用，请复制下方数据发送给管理员。</p>
    <textarea id="modal-json" readonly onclick="this.select()"></textarea>
    <div class="modal-btns">
      <button class="btn btn-submit" style="padding:10px 24px;font-size:14px;" onclick="copyModalJSON()">复制到剪贴板</button>
      <button class="btn btn-prev" style="padding:10px 24px;font-size:14px;" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ALL QUESTIONS — Fully Embedded
   ============================================================ */
var ALL_QUESTIONS = {
  content_leader: {
    intro: "这份问卷主要看内容团队在脚本以外，还有哪些工作可以靠 AI、模板、检查表或 SOP 提效。脚本生成工具已有，重点问复盘、判断标准、返工、团队协作和标准沉淀。",
    questions: [
      {id:"q1",title:"你这条线现在最重要的结果是什么？",type:"select",options:["提高爆款率","减少返工","提升账号增长","提升新人培养","复盘更准","标准更统一"]},

/* ============================================================
   State
   ============================================================ */
var currentRole = null;
var isDirectLink = false;
var questions = [];
var currentStep = -1;
var answers = {};

/* ============================================================
   Screen Navigation
   ============================================================ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById('screen-' + id).classList.add('active');
}

function selectRole(role) {
  currentRole = role;
  showScreen('interview');
  loadQuestions(role);
}

function goBack() {
  if (isDirectLink) return;
  currentRole = null; questions = []; currentStep = -1; answers = {};
  showScreen('role');
}

/* ============================================================
   Build Progress Dots
   ============================================================ */
function buildProgressDots(total, current) {
  var html = '';
  for (var i = 0; i < total; i++) {
    var cls = 'progress-dot';
    if (i < current) cls += ' done';
    else if (i === current) cls += ' active';
    html += '<span class="' + cls + '"></span>';
  }
  return html;
}

/* ============================================================
   Load Questions
   ============================================================ */
var ROLE_NAMES = {
  content_leader: '内容负责人/管理层',
  content_editor: '内容编导',
  broker_leader: '经纪负责人/管理层',
  broker: '经纪'
};

function loadQuestions(role) {
  var data = ALL_QUESTIONS[role];
  if (!data) {
    document.getElementById('question-area').innerHTML = '<div class="msg-error">未知岗位类型</div>';
    return;
  }
  document.getElementById('interview-title').textContent = ROLE_NAMES[role] + ' · 岗位提效采访';
  document.getElementById('interview-subtitle').textContent = '按真实情况写，不用正式，越具体越有用';
  questions = data.questions;
  document.getElementById('intro-text').textContent = data.intro || '';
  answers = {};
  currentStep = -1;
  showInfoScreen();
}

function showInfoScreen() {
  document.getElementById('info-section').classList.remove('hidden');
  document.getElementById('progress-section').classList.add('hidden');
  document.getElementById('question-area').innerHTML = '';
  document.getElementById('btn-prev').classList.add('hidden');
  document.getElementById('btn-next').classList.remove('hidden');
  document.getElementById('btn-submit').classList.add('hidden');
  document.getElementById('btn-next').textContent = '开始答题';
  document.getElementById('submit-msg').innerHTML = '';
}

function renderQuestion(idx) {
  if (idx < 0 || idx >= questions.length) return;
  document.getElementById('info-section').classList.add('hidden');
  document.getElementById('progress-section').classList.remove('hidden');
  document.getElementById('progress-section').innerHTML = buildProgressDots(questions.length, idx);

  var q = questions[idx];
  var existing = answers[q.id];
  var note = '';
  var selected = [];
  var textVal = '';

  if (existing) {
    if (typeof existing === 'object') { note = existing.note || ''; selected = existing.selected || []; }
    else { textVal = existing; }
  }

  var html = '<div class="question-card">';
  html += '<div class="question-num">第 ' + (idx+1) + ' 题 / 共 ' + questions.length + ' 题</div>';
  html += '<div class="question-title">' + q.title + '</div>';
  if (q.note_prompt) html += '<div class="question-prompt">' + escHtml(q.note_prompt) + '</div>';

  if (q.type === 'select') {
    html += '<div class="options-grid">';
    q.options.forEach(function(opt){
      var sel = selected.indexOf(opt) >= 0 ? ' selected' : '';
      html += '<span class="option-chip' + sel + '" onclick="toggleOption(this,\'' + q.id + '\',\'' + escAttr(opt) + '\')">' + opt + '</span>';
    });
    html += '</div>';
    html += '<div class="note-wrap">';
    html +=   '<div class="note-label">';
    html +=     '<svg class="icon-pencil" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
    html +=     '补充你的想法';
    html +=     '<span style="font-weight:400;opacity:0.6;margin-left:4px;">（打字补充，越具体越好）</span>';
    html +=   '</div>';
    html +=   '<textarea class="note-input" placeholder="说说你选这个的原因、遇到的具体情况……" id="note-' + q.id + '" oninput="updateNote(\'' + q.id + '\', this.value); updateCharCount(this, \'count-' + q.id + '\')">' + escHtml(note) + '</textarea>';
    html +=   '<div class="note-hint" id="count-' + q.id + '"></div>';
    html += '</div>';
  } else {
    var cls = q.id === 'q14' ? 'text-input' : 'text-input text-input-short';
    html += '<textarea class="' + cls + '" placeholder="' + escAttr(q.note_prompt || '') + '" id="text-' + q.id + '" onchange="updateText(\'' + q.id + '\', this.value)">' + escHtml(textVal) + '</textarea>';
  }
  html += '</div>';
  document.getElementById('question-area').innerHTML = html;

  document.getElementById('btn-prev').classList.toggle('hidden', idx === 0);
  document.getElementById('btn-next').classList.toggle('hidden', idx === questions.length - 1);
  document.getElementById('btn-submit').classList.toggle('hidden', idx !== questions.length - 1);
  document.getElementById('btn-next').textContent = '下一题';

  window.scrollTo({ top: 0, behavior: 'smooth' });

  // Init char counts for existing notes
  var noteEl = document.getElementById('note-' + questions[idx].id);
  if (noteEl) updateCharCount(noteEl, 'count-' + questions[idx].id);
}

function nextQuestion() {
  saveCurrentAnswer();
  if (currentStep === -1) { currentStep = 0; renderQuestion(0); return; }
  currentStep++;
  if (currentStep >= questions.length) currentStep = questions.length - 1;
  renderQuestion(currentStep);
}

function prevQuestion() {
  saveCurrentAnswer();
  currentStep--;
  if (currentStep < 0) { showInfoScreen(); return; }
  renderQuestion(currentStep);
}

/* ============================================================
   Answers
   ============================================================ */
function toggleOption(el, qid, opt) {
  el.classList.toggle('selected');
  var sels = [];
  el.parentElement.querySelectorAll('.option-chip.selected').forEach(function(c){ sels.push(c.textContent.trim()); });
  if (!answers[qid] || typeof answers[qid] === 'string') answers[qid] = {selected:[], note:''};
  answers[qid].selected = sels;
}

function updateNote(qid, val) {
  if (!answers[qid] || typeof answers[qid] === 'string') answers[qid] = {selected:[], note:''};
  answers[qid].note = val;
}

function updateCharCount(el, countId) {
  var count = el.value.length;
  var display = document.getElementById(countId);
  if (!display) return;
  if (count > 0) { display.textContent = '已输入 ' + count + ' 字'; }
  else { display.textContent = ''; }
}

function updateText(qid, val) { answers[qid] = val; }

function saveCurrentAnswer() {
  if (currentStep >= 0 && currentStep < questions.length) {
    var q = questions[currentStep];
    if (q.type === 'text') {
      var el = document.getElementById('text-' + q.id);
      if (el) answers[q.id] = el.value;
    }
    // Note: select-type notes are already saved in real-time via oninput on the textarea
  }
}

/* ============================================================
   Submit
   ============================================================ */
async function submitForm() {
  saveCurrentAnswer();
  var btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = '提交中…';
  document.getElementById('progress-section').innerHTML = buildProgressDots(questions.length, questions.length);

  var name = document.getElementById('input-name').value.trim();

  if (!name) {
    document.getElementById('submit-msg').innerHTML = '<div class="msg-error">请先填写你的名字</div>';
    btn.disabled = false; btn.textContent = '提交'; return;
  }

  var payload = { role: currentRole, name: name, position: '', answers: answers };
  var submitted = false;

  try {
    var resp = await fetch('/api/submit', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    var result = await resp.json();
    if (result.success) submitted = true;
  } catch(e) {}

  if (submitted) {
    document.getElementById('complete-icon').textContent = '🎉';
    document.getElementById('complete-title').textContent = '提交成功';
    document.getElementById('complete-desc').textContent = '感谢你的时间。这些信息会帮我们找到真正需要提效的地方。';
    showScreen('complete');
  } else {
    // Always show completion screen, never go back to questions
    fallbackSave(payload);
    document.getElementById('complete-icon').textContent = '✅';
    document.getElementById('complete-title').textContent = '已保存';
    document.getElementById('complete-desc').textContent = '数据已记录，管理员稍后会处理。感谢你的时间。';
    showScreen('complete');
  }
}

function showCopyModal(payload) {
  document.getElementById('modal-json').value = JSON.stringify(payload, null, 2);
  document.getElementById('modal-copy').classList.remove('hidden');
}

function copyModalJSON() {
  var ta = document.getElementById('modal-json');
  ta.select();
  try { navigator.clipboard.writeText(ta.value); } catch(e) { document.execCommand('copy'); }
  var btn = document.querySelector('#modal-copy .btn-submit');
  btn.textContent = '已复制';
  setTimeout(function(){ btn.textContent = '复制到剪贴板'; }, 2000);
}

function closeModal() {
  document.getElementById('modal-copy').classList.add('hidden');
  document.getElementById('btn-submit').disabled = false;
  document.getElementById('btn-submit').textContent = '重新提交';
}

function fallbackSave(payload) {
  try {
    var queue = JSON.parse(localStorage.getItem('interview_queue') || '[]');
    payload._savedAt = new Date().toISOString();
    queue.push(payload);
    localStorage.setItem('interview_queue', JSON.stringify(queue));
    document.getElementById('submit-msg').innerHTML =
      '<div class="msg-success">已保存到本地（第 ' + queue.length + ' 份待同步）<br><small>管理员稍后将统一上传到飞书</small></div>';
  } catch(e) {
    document.getElementById('submit-msg').innerHTML =
      '<div class="msg-error">提交失败，请刷新页面重试<br><small>错误: ' + escHtml(e.message) + '</small></div>';
  }
}

/* ============================================================
   Helpers
   ============================================================ */
function escHtml(s) { if(!s)return''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { if(!s)return''; return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ============================================================
   Connection check
   ============================================================ */
(function checkServer() {
  var dot = document.getElementById('status-dot');
  var txt = document.getElementById('status-text');
  fetch('/api/health').then(function(r){ return r.json(); }).then(function(d){
    if(d && d.feishu_connected){ dot.className = 'status-dot online'; txt.textContent = '飞书已连接'; }
    else { txt.textContent = '连接中…'; }
  }).catch(function(){ txt.textContent = '离线模式'; });
})();

/* ============================================================
   URL Role Detection — key feature!
   ============================================================ */
(function detectRoleFromURL() {
  var params = new URLSearchParams(location.search);
  var role = params.get('role');
  if (role && ALL_QUESTIONS[role]) {
    isDirectLink = true;
    document.getElementById('back-link').classList.add('hidden');
    selectRole(role);
  }
})();
</script>
